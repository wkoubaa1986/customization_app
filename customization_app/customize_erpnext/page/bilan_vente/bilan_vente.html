<div class="bv-page">
  <style>
    .bv-page {
      padding: 14px 18px;
      --bv-gain: #006300;
      --bv-gain-bg: #e4f3e4;
      --bv-loss: #c22f2f;
      --bv-loss-bg: #fdeaea;
      --bv-aw: #2a78d6;
      --bv-aw-soft: #e7f0fb;
      --bv-ec: #16967d;
      --bv-ec-soft: #e2f4ef;
      --bv-especes: #0f7d5c;  --bv-especes-bg: #dff2ec;
      --bv-cheque:  #1d5fae;  --bv-cheque-bg:  #e3edfa;
      --bv-autre:   #b8501f;  --bv-autre-bg:   #fbe9df;
    }
    [data-theme="dark"] .bv-page {
      --bv-gain: #3fc36a;
      --bv-gain-bg: #16311c;
      --bv-loss: #ef6d6d;
      --bv-loss-bg: #3a1c1c;
      --bv-aw: #4a90e2;
      --bv-aw-soft: #1b2a3d;
      --bv-ec: #2eb397;
      --bv-ec-soft: #14312a;
      --bv-especes: #3fc39a; --bv-especes-bg: #123127;
      --bv-cheque:  #6ba6ec; --bv-cheque-bg:  #17293f;
      --bv-autre:   #eb8a55; --bv-autre-bg:   #3a2415;
    }

    .bv-toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; background: var(--card-bg, #fff);
      border: 1px solid var(--border-color, #e4e8ee); border-radius: 10px;
      margin-bottom: 16px;
    }
    .bv-toolbar label { margin: 0; font-size: 12px; color: var(--text-muted, #7a8291); font-weight: 600; }
    .bv-toolbar select.form-control { width: 180px; }
    .bv-spacer { flex: 1; }
    .bv-period { font-size: 12px; color: var(--text-muted, #7a8291); }

    .bv-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .bv-kpigroup {
      background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e4e8ee);
      border-radius: 10px; padding: 12px 14px;
    }
    .bv-kpigroup .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .bv-kpigroup .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted, #7a8291); font-weight: 600; }
    .bv-kpigroup .tag { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
    .bv-kpigroup .note { font-size: 11px; color: var(--text-muted, #7a8291); }
    .bv-kpigroup[data-owner="aqua_world"] { border-top: 3px solid var(--bv-aw); }
    .bv-kpigroup[data-owner="aqua_world"] .tag { background: var(--bv-aw-soft); color: var(--bv-aw); }
    .bv-kpigroup[data-owner="economiq"] { border-top: 3px solid var(--bv-ec); }
    .bv-kpigroup[data-owner="economiq"] .tag { background: var(--bv-ec-soft); color: var(--bv-ec); }
    .bv-kpigroup .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; }
    .bv-kpi .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-muted, #7a8291); font-weight: 600; white-space: nowrap; }
    .bv-kpi .val { font-size: 16px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bv-kpi.gain .val { color: var(--bv-gain); }
    .bv-kpi.loss .val { color: var(--bv-loss); }

    .bv-cashcard {
      background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e4e8ee);
      border-radius: 10px; padding: 12px 14px 14px; margin-bottom: 24px;
    }
    .bv-cashcard .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted, #7a8291); font-weight: 600; margin-bottom: 8px; }
    .bv-cashbar { display: flex; height: 20px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--bg-light-gray, #f4f5f6); }
    .bv-cashbar .seg { min-width: 3px; }
    .bv-cashbar .seg.especes { background: var(--bv-especes); }
    .bv-cashbar .seg.cheque  { background: var(--bv-cheque); }
    .bv-cashbar .seg.autre   { background: var(--bv-autre); }
    .bv-cashlegend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--text-muted, #6b7280); }
    .bv-cashlegend b { color: var(--text-color, #1f272e); font-variant-numeric: tabular-nums; }
    .bv-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

    .bv-section { margin-bottom: 32px; }
    .bv-section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .bv-section-head .bar { width: 4px; height: 24px; border-radius: 2px; }
    .bv-section-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
    .bv-section-head .tag { font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
    .bv-section-head .note { color: var(--text-muted, #7a8291); font-size: 12px; }
    .bv-section-head .count { color: var(--text-muted, #7a8291); font-size: 12px; margin-left: auto; }
    .bv-section[data-owner="aqua_world"] .bar { background: var(--bv-aw); }
    .bv-section[data-owner="aqua_world"] .tag { background: var(--bv-aw-soft); color: var(--bv-aw); }
    .bv-section[data-owner="aqua_world"] .bv-so { color: var(--bv-aw); }
    .bv-section[data-owner="economiq"] .bar { background: var(--bv-ec); }
    .bv-section[data-owner="economiq"] .tag { background: var(--bv-ec-soft); color: var(--bv-ec); }
    .bv-section[data-owner="economiq"] .bv-so { color: var(--bv-ec); }

    .bv-order {
      background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e4e8ee);
      border-radius: 10px; margin-bottom: 8px; overflow: hidden;
    }
    .bv-order-head {
      display: grid; grid-template-columns: 16px 1.3fr 1.6fr 120px 130px 140px; gap: 12px;
      align-items: center; padding: 10px 14px; cursor: pointer; border: 0; width: 100%;
      background: none; font: inherit; color: inherit; text-align: left;
    }
    .bv-order-head:hover { background: var(--bg-light-gray, #f6f8fa); }
    .bv-caret { color: var(--text-muted, #98a1ad); transition: transform .15s ease; font-size: 10px; }
    .bv-order.open .bv-caret { transform: rotate(90deg); }
    .bv-so { font-weight: 600; text-decoration: none; }
    .bv-so:hover { text-decoration: underline; }
    .bv-cust { color: var(--text-muted, #566270); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .bv-num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .bv-ttc { font-weight: 600; }
    .bv-paystate { font-size: 12.5px; font-weight: 600; }
    .bv-paystate.ok { color: var(--bv-gain); }
    .bv-paystate.due { color: var(--bv-loss); }
    .bv-chip {
      display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 700;
      font-variant-numeric: tabular-nums; font-size: 12.5px;
    }
    .bv-chip.pos { color: var(--bv-gain); background: var(--bv-gain-bg); }
    .bv-chip.neg { color: var(--bv-loss); background: var(--bv-loss-bg); }

    .bv-order-body { display: none; border-top: 1px solid var(--border-color, #e4e8ee); padding: 12px 14px 14px; }
    .bv-order.open .bv-order-body { display: block; }
    .bv-order-body h6 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted, #8a93a0); font-weight: 600; }
    .bv-scroll { overflow-x: auto; }
    table.bv-tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
    table.bv-tbl th { text-align: left; color: var(--text-muted, #8a93a0); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; padding: 5px 9px; border-bottom: 1px solid var(--border-color, #e4e8ee); white-space: nowrap; }
    table.bv-tbl th.bv-num { text-align: right; }
    table.bv-tbl td { padding: 6px 9px; border-bottom: 1px solid var(--border-color, #eef1f5); }
    table.bv-tbl tbody tr:last-child td { border-bottom: 0; }
    table.bv-tbl tfoot td { font-weight: 700; border-top: 2px solid var(--border-color, #e4e8ee); border-bottom: 0; background: var(--bg-light-gray, #f6f8fa); }
    td.bv-gain { color: var(--bv-gain); font-weight: 600; }
    td.bv-loss { color: var(--bv-loss); font-weight: 600; }

    .bv-paycols { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 14px; }
    .bv-paylist { display: flex; flex-direction: column; gap: 6px; }
    .bv-payrow { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .bv-payrow .amt { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
    .bv-payrow .ref { color: var(--text-muted, #8a93a0); font-size: 12px; }
    .bv-badge { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
    .bv-badge.especes { color: var(--bv-especes); background: var(--bv-especes-bg); }
    .bv-badge.cheque  { color: var(--bv-cheque);  background: var(--bv-cheque-bg); }
    .bv-badge.autre   { color: var(--bv-autre);   background: var(--bv-autre-bg); }
    .bv-empty { color: var(--text-muted, #aab1bd); font-style: italic; font-size: 12.5px; }

    .bv-bilan {
      border: 1px solid var(--border-color, #e4e8ee); border-radius: 10px;
      background: var(--card-bg, #fff); padding: 14px 16px; margin-top: 12px;
    }
    .bv-bilan h5 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted, #6b7280); font-weight: 700; }
    .bv-bilan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 18px; }
    .bv-bilan-grid .k { font-size: 11.5px; color: var(--text-muted, #8a93a0); }
    .bv-bilan-grid .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .bv-solde {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      display: flex; align-items: center; gap: 10px; font-weight: 700;
    }
    .bv-solde .amount { margin-left: auto; font-size: 17px; font-variant-numeric: tabular-nums; }
    .bv-section[data-owner="aqua_world"] .bv-solde { background: var(--bv-aw-soft); color: var(--bv-aw); }
    .bv-section[data-owner="economiq"] .bv-solde { background: var(--bv-ec-soft); color: var(--bv-ec); }
    .bv-cheques { margin-top: 10px; font-size: 12.5px; color: var(--text-muted, #566270); }
    .bv-cheques b { color: var(--text-color, #1f272e); }

    .bv-paydetail { margin-top: 12px; border-top: 1px solid var(--border-color, #e4e8ee); padding-top: 10px; }
    .bv-paydetail summary {
      cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text-muted, #6b7280); user-select: none;
    }
    .bv-paydetail summary:hover { color: var(--text-color, #1f272e); }
    .bv-paydetail .bv-scroll { margin-top: 8px; }

    .bv-tasks { margin-top: 14px; }
    .bv-task {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border-color, #eef1f5);
    }
    .bv-task:last-child { border-bottom: 0; }
    .bv-task .bv-task-link { font-weight: 600; }
    .bv-task .meta { color: var(--text-muted, #566270); font-size: 12.5px; }
    .bv-task .meta b { color: var(--text-color, #1f272e); }

    .bv-badge.st-green  { color: var(--bv-gain);  background: var(--bv-gain-bg); }
    .bv-badge.st-red    { color: var(--bv-loss);  background: var(--bv-loss-bg); }
    .bv-badge.st-orange { color: var(--bv-autre); background: var(--bv-autre-bg); }
    .bv-badge.st-gray, .bv-badge.st-neutral { color: var(--text-muted, #6b7280); background: var(--bg-light-gray, #f0f2f4); }

    .bv-pv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .bv-pv-table td { padding: 6px 8px; border-bottom: 1px solid var(--border-color, #eef1f5); }
    .bv-pv-table tr:last-child td { border-bottom: 0; }
    .bv-pv-table td.bv-pv-label { color: var(--text-muted, #7a8291); width: 40%; font-weight: 600; font-size: 12px; }

    .bv-form-frame { width: 100%; height: 78vh; border: 0; border-radius: 6px; background: var(--bg-color, #f6f8f8); }

    @media (max-width: 820px) {
      .bv-order-head { grid-template-columns: 16px 1fr 120px; }
      .bv-order-head .bv-cust, .bv-order-head .bv-paystate-cell, .bv-order-head .bv-chip-cell { display: none; }
      .bv-paycols { grid-template-columns: 1fr; }
    }
    .bv-check { display: inline-flex; align-items: center; gap: 6px; margin: 0;
                font-weight: 400; white-space: nowrap; cursor: pointer; }
    .bv-check input { margin: 0; }
    .bv-note { color: #b45309; font-size: 12px; }
    @media print {
      .bv-toolbar { display: none; }
      .bv-order-body { display: block; }
    }
  </style>

  <div class="bv-toolbar">
    <label for="bv-month">Mois</label>
    <select id="bv-month" class="form-control"></select>
    <label for="bv-base">Compter sur</label>
    <select id="bv-base" class="form-control">
      <option value="livraison">Date de livraison</option>
      <option value="tache">Date de la tache</option>
    </select>
    <label class="bv-check" for="bv-ouvertes">
      <input type="checkbox" id="bv-ouvertes"> Exclure les taches ouvertes
    </label>
    <button class="btn btn-default btn-sm" data-action="refresh">Actualiser</button>
    <span class="bv-period" data-role="period"></span>
    <span class="bv-note" data-role="ecartees"></span>
    <span class="bv-spacer"></span>
    <button class="btn btn-default btn-sm" data-action="toggle-all">Tout déplier</button>
    <button class="btn btn-default btn-sm" data-action="excel">Exporter Excel</button>
    <button class="btn btn-default btn-sm" data-action="print">Imprimer</button>
  </div>

  <div class="bv-kpis" data-role="kpis"></div>
  <div class="bv-cashcard">
    <div class="lbl">Répartition des encaissements du mois</div>
    <div class="bv-cashbar" data-role="cashbar"></div>
    <div class="bv-cashlegend" data-role="cashlegend"></div>
  </div>
  <div data-role="sections"></div>
</div>
