<div class="fac-page">
  <style>
    .fac-page { padding: 14px 18px; }
    .fac-card { background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee);
                border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .fac-params { display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: flex-end; }
    .fac-field { display: flex; flex-direction: column; gap: 4px; }
    .fac-field label { margin: 0; font-size: 11.5px; font-weight: 600; color: var(--text-muted,#6b7280); text-transform: uppercase; letter-spacing: .3px; }
    .fac-field .form-control { width: 150px; }
    .fac-check { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--text-color,#36414c); cursor: pointer; user-select: none; }
    .fac-check input { width: 16px; height: 16px; cursor: pointer; }
    .fac-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .fac-hint { font-size: 11.5px; color: #9aa2ad; margin-top: 8px; }

    .fac-banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; font-weight: 600; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .fac-banner.dry { background: #e1ecff; color: #1f3a5f; border: 1px solid #bcd3f5; }
    .fac-banner.commit { background: #d4edda; color: #155724; border: 1px solid #b6ddc0; }
    .fac-badge { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; letter-spacing: .5px; }
    .fac-badge.dry { background: #2b6cb0; color: #fff; }
    .fac-badge.commit { background: #2e9e5b; color: #fff; }

    .fac-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; margin-bottom: 16px; }
    .fac-kpi { border-radius: 12px; padding: 14px 16px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .fac-kpi .lbl { font-size: 11px; font-weight: 600; opacity: .95; text-transform: uppercase; letter-spacing: .3px; }
    .fac-kpi .val { font-size: 20px; font-weight: 800; margin-top: 5px; }
    .fac-kpi .sub { font-size: 10.5px; opacity: .9; margin-top: 2px; }

    .fac-sub { font-size: 13px; font-weight: 700; margin: 18px 0 8px; color: var(--text-color,#36414c); }
    table.fac-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    table.fac-tbl th { text-align: left; padding: 8px 10px; background: var(--bg-light-gray,#f6f8fa); color: #6b7280;
                       font-weight: 600; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border-color,#e4e8ee); white-space: nowrap; }
    table.fac-tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border-color,#eef1f5); }
    table.fac-tbl th.num, table.fac-tbl td.num { text-align: right; white-space: nowrap; }
    table.fac-tbl tr:hover td { background: rgba(0,0,0,.02); }
    .fac-diff-bad { color: #b02a37; font-weight: 700; }
    .fac-kv { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 6px 20px; font-size: 12.5px; }
    .fac-kv div { padding: 3px 0; }
    .fac-kv b { color: var(--text-color,#36414c); }
    .fac-errors { background: #f8d7da; border: 1px solid #f0b6bd; border-radius: 8px; padding: 10px 14px; color: #721c24; font-size: 12.5px; }
    .fac-errors ul { margin: 6px 0 0; padding-left: 18px; }
    .fac-muted { color: #9aa2ad; }
    .fac-state-card { background: linear-gradient(135deg,#1f2d3d,#2b4c7e); color:#fff; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .fac-state-head { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; letter-spacing:.3px; opacity:.95; margin-bottom:12px; }
    .fac-state-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .fac-state-box { background: rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:12px 14px; }
    .fac-state-box .lbl { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; opacity:.85; }
    .fac-state-box .val { font-size:24px; font-weight:800; margin-top:4px; line-height:1.1; }
    .fac-state-box .sub { font-size:10.5px; opacity:.8; margin-top:2px; }
    .fac-state-box.accent { background: rgba(240,180,40,.22); border-color: rgba(240,180,40,.45); }
    .fac-state-period { font-size:11px; opacity:.85; margin-top:10px; }
    .fac-state-loading { color:#9aa2ad; font-size:12.5px; padding:8px 0; }
    #fac-denied { display: none; padding: 40px; text-align: center; color: #b02a37; font-size: 15px; font-weight: 600; }
    #fac-loading { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 9999; align-items: center; justify-content: center; }
  </style>

  <div id="fac-denied">⛔ Accès réservé. Cet outil est réservé à l’administrateur de facturation.</div>

  <div id="fac-main">
    <!-- État actuel de la base (avant lancement) -->
    <div id="fac-state"></div>

    <!-- Paramètres -->
    <div class="fac-card">
      <div class="fac-params">
        <label class="fac-check"><input type="checkbox" id="fac-use-gaps" /> Remplir les trous (use_gaps)</label>
        <label class="fac-check"><input type="checkbox" id="fac-leftover" /> Créer PASSAGER restants (create_leftover)</label>
        <label class="fac-check"><input type="checkbox" id="fac-verbose" /> Logs détaillés (verbose)</label>
        <div class="fac-field">
          <label>Dernière facture cible (last_fac_num)</label>
          <input type="number" id="fac-last-num" class="form-control input-sm" placeholder="auto" />
        </div>
        <div class="fac-field">
          <label>Facteur PASSAGER (passager_factor)</label>
          <input type="number" step="0.01" id="fac-passager" class="form-control input-sm" value="0.5" />
        </div>
      </div>
      <div class="fac-actions">
        <button id="fac-dry" class="btn btn-primary btn-sm">🔍 Simuler (dry-run)</button>
        <button id="fac-commit" class="btn btn-danger btn-sm">⚠️ Générer réellement</button>
      </div>
      <div class="fac-hint">Le dry-run n’enregistre rien (rollback). La génération réelle crée et soumet les factures du mois précédent. Demande confirmation.</div>
    </div>

    <!-- Résultat -->
    <div id="fac-result"></div>
  </div>

  <div id="fac-loading"><div class="text-muted" style="font-size:15px;">Traitement en cours…</div></div>
</div>
