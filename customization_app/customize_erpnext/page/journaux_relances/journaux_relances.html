<div class="jr-page">
  <style>
    .jr-page { padding: 12px 16px; }
    .jr-card { background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .jr-intro { font-size: 12.5px; color: #475569; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
    .jr-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; align-items: baseline; }
    .jr-head b { font-size: 14px; }
    .jr-quand { font-size: 11.5px; color: #64748b; }
    .jr-badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; }
    .jr-ok { background: #dcfce7; color: #166534; } .jr-ko { background: #fee2e2; color: #991b1b; } .jr-na { background: #f1f5f9; color: #475569; }
    .jr-warn { background: #ffedd5; color: #9a3412; }
    .jr-pre { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; background: #f8fafc; border-radius: 8px; padding: 8px 10px; margin-top: 8px; color: #334155; max-height: 220px; overflow: auto; }
    .jr-err { font-size: 12px; margin-top: 6px; }
    .jr-err a { color: #b91c1c; }
    .jr-vide { color: #94a3b8; font-size: 12px; }
    .jr-sig { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.4; padding: 6px 9px; border-radius: 8px; margin-top: 6px; }
    .jr-sig a { color: inherit; text-decoration: underline; }
    .jr-sig-rouge { background: #fee2e2; color: #991b1b; }
    .jr-sig-orange { background: #ffedd5; color: #9a3412; }
    .jr-tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 10px; margin-top: 10px; }
    .jr-tuile { border: 1px solid var(--border-color,#e4e8ee); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .jr-tuile h4 { font-size: 12px; color: #64748b; margin: 0 0 4px; font-weight: 600; }
    .jr-chiffre { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .jr-ligne { font-size: 12px; display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
    .jr-ligne > span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
    .jr-retrait { padding-left: 10px; color: #475569; }
    .jr-note { font-size: 11.5px; color: #64748b; margin-top: 6px; }
    .jr-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; }
    .jr-table { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
    .jr-table th, .jr-table td { border-bottom: 1px solid var(--border-color,#e4e8ee); padding: 4px 8px; text-align: right; font-variant-numeric: tabular-nums; }
    .jr-table th:first-child, .jr-table td:first-child { text-align: left; position: sticky; left: 0; background: var(--card-bg,#fff); }
    .jr-table th { color: #64748b; font-weight: 600; vertical-align: bottom; }
    .jr-table tr.jr-dim td { color: #94a3b8; }
    .jr-table td.jr-rouge { color: #b91c1c; font-weight: 700; }
    .jr-chips { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
    .jr-chip { font-size: 11px; background: #f1f5f9; color: #334155; border-radius: 6px; padding: 1px 6px; }
    .jr-page details summary { cursor: pointer; font-size: 11.5px; color: #64748b; margin-top: 4px; }
  </style>
  <div class="jr-card jr-intro" id="jr-intro">Chargement…</div>
  <div id="jr-entonnoir"><div class="jr-card jr-vide">Entonnoir du jour : calcul en cours…</div></div>
  <div id="jr-liste"></div>
</div>
