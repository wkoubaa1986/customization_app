<div class="ala-page">
  <style>
    .ala-page { --ala-accent: #6d28d9; --ala-gain: #16a34a; --ala-gain-bg: #dcfce7;
                --ala-warn: #b45309; --ala-warn-bg: #fef3c7; --ala-loss: #dc2626;
                --ala-loss-bg: #fee2e2; padding: 4px 0 40px; }
    .ala-page h1 { font-size: 20px; font-weight: 700; margin: 0 0 16px; }

    .ala-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .ala-toolbar label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                         color: var(--text-muted, #7a8291); margin: 0 2px 0 0; }
    .ala-toolbar input.form-control { width: 150px; }
    .ala-spacer { flex: 1; }

    .ala-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 10px; margin-bottom: 20px; }
    .ala-kpi { background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e4e8ee);
               border-radius: 8px; padding: 12px 14px; }
    .ala-kpi.warn { border-color: var(--ala-warn); }
    .ala-kpi.loss { border-color: var(--ala-loss); }
    .ala-kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
                    color: var(--text-muted, #7a8291); }
    .ala-kpi .val { font-size: 19px; font-weight: 700; margin-top: 4px; }
    .ala-kpi .val .sub { font-size: 12px; font-weight: 500; color: var(--text-muted, #7a8291); }

    .ala-liste { background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e4e8ee);
                 border-radius: 8px; overflow: hidden; }
    .ala-colis { display: grid; grid-template-columns: 1.4fr 1.5fr 1.6fr; gap: 14px;
                 padding: 12px 14px; border-bottom: 1px solid var(--border-color, #eef1f5); }
    .ala-colis:last-child { border-bottom: 0; }
    .ala-colis.alerte { background: var(--ala-loss-bg); }
    .ala-colis .nom { font-weight: 600; }
    .ala-menu { font-size: 12px; color: var(--text-muted, #7a8291); line-height: 1.5; }
    .ala-menu a { color: inherit; }
    .ala-adresse { white-space: pre-line; font-size: 12px; color: var(--text-muted, #7a8291); }

    .ala-chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px;
                font-weight: 600; }

    /* ⚠️ AUCUNE APOSTROPHE DROITE DANS CE FICHIER — on écrit toujours l’apostrophe typographique.
       Frappe expédie le gabarit entier au navigateur dans une chaîne JS délimitée par des
       guillemets SIMPLES, et son échappement (frappe/build.py, scrub_html_template) remplace
       l’apostrophe droite par elle-même : un no-op. Une seule suffit donc à fermer la chaîne et à
       tuer TOUT le script de la page, y compris le JS qui la suit — la page se charge vide, sans
       erreur parlante. Les commentaires CSS ne protègent rien : seuls les commentaires HTML sont
       retirés avant l’envoi. */
    /* Les pièces du colis : cliquables, donc elles doivent en avoir l’air. */
    .ala-piece { display: inline-block; margin: 0 4px 4px 0; padding: 1px 7px; border-radius: 6px;
                 border: 1px solid var(--border-color, #e4e8ee); font-size: 11.5px;
                 cursor: pointer; background: var(--bg-light-gray, #f6f7f9); }
    .ala-piece:hover { border-color: var(--ala-accent); color: var(--ala-accent); }
    /* Celle que le paiement pointe : c’est par elle que le colis est entré dans ce tableau. */
    .ala-piece.payee { border-color: var(--ala-accent); }
    .ala-piece b { font-weight: 700; }
    .ala-piece .etat { color: var(--text-muted, #7a8291); }
    /* Le formulaire complet tient dans la fenêtre : assez haut pour qu’on n’y défile pas deux fois
       (une fois la page, une fois le cadre). */
    .ala-cadre { width: 100%; height: 72vh; border: 0; }
    .ala-etapes { display: flex; gap: 3px; margin-top: 6px; }
    .ala-etape { height: 5px; flex: 1; border-radius: 3px; background: var(--border-color, #e4e8ee); }
    .ala-etape.franchie { background: var(--ala-gain); }
    /* ⚠️ « courante » ne colore que ce qui n’est PAS encore franchi. Le service marque la
       dernière étape d’un colis livré comme franchie ET courante : sans cette précision, un
       colis arrivé à bon port affichait un dernier segment orange, comme s’il coinçait. */
    .ala-etape.courante:not(.franchie) { background: var(--ala-warn); }
    .ala-maj { font-size: 12px; margin-top: 6px; }
    .ala-vide { padding: 26px; text-align: center; color: var(--text-muted, #7a8291); }
  </style>

  <h1>Livraisons Aramex — Suivi</h1>

  <div class="ala-toolbar">
    <label>Du</label><input type="date" class="form-control input-sm" id="ala-from">
    <label>au</label><input type="date" class="form-control input-sm" id="ala-to">
    <button class="btn btn-default btn-sm" data-action="refresh">Actualiser</button>
    <span class="ala-spacer"></span>
    <label style="text-transform:none"><input type="checkbox" data-role="alertes-seules"> Alertes seulement</label>
    <label style="text-transform:none" title="Un seul SMS par bordereau, jamais pour un colis livré">
      <input type="checkbox" data-role="sms-auto"> Prévenir le client après la synchro de 16h
    </label>
    <button class="btn btn-primary btn-sm" data-action="suivre">🚚 Interroger le suivi</button>
  </div>

  <div class="ala-kpis" data-role="kpis"></div>
  <div data-role="colis"></div>
</div>
