<div class="mj-page">
  <style>
    .mj-page { padding: 12px 14px; max-width: 980px; margin: 0 auto; }
    .mj-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
              margin-bottom: 12px; }
    .mj-field { display: flex; flex-direction: column; gap: 3px; }
    .mj-field label { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .3px;
                      text-transform: uppercase; color: var(--text-muted,#6b7280); }
    .mj-field .form-control { height: 30px; font-size: 12.5px; width: 190px; }
    .mj-compte { margin-left: auto; font-size: 12.5px; color: var(--text-muted,#6b7280); }

    .mj-carte { border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px;
                background: var(--card-bg,#fff); margin-bottom: 10px; overflow: hidden;
                box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .mj-carte.faite { opacity: .62; }
    .mj-tete { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
               border-bottom: 1px solid var(--border-color,#eef1f5); flex-wrap: wrap; }
    .mj-heure { font-weight: 700; font-size: 15px; white-space: nowrap; }
    .mj-client { font-weight: 600; }
    .mj-corps { padding: 10px 12px; display: grid; gap: 9px; }
    .mj-l { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
    .mj-l .k { color: var(--text-muted,#6b7280); min-width: 84px; font-weight: 600;
               font-size: 11px; text-transform: uppercase; letter-spacing: .3px;
               padding-top: 2px; }
    .mj-badge { display: inline-block; padding: 1px 7px; border-radius: 999px;
                font-size: 10.5px; font-weight: 700; white-space: nowrap; }
    .b-ok { background: #dcfce7; color: #166534; }
    .b-ko { background: #fee2e2; color: #b02a37; }
    .b-att { background: #fef3c7; color: #92400e; }
    .b-inf { background: #e0f2fe; color: #075985; }
    .b-gris { background: #eef2f7; color: #64748b; }
    .mj-tel { display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; }
    .mj-art { padding: 1px 0; }
    .mj-actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 9px 12px;
                  border-top: 1px solid var(--border-color,#eef1f5);
                  background: var(--bg-light-gray,#f8fafc); }
    .mj-manque { font-size: 12px; color: #b02a37; }
    .mj-vide { padding: 30px; text-align: center; color: var(--text-muted,#6b7280); }
  </style>

  <div class="mj-bar">
    <div class="mj-field"><label>Jour</label>
      <input type="date" class="form-control" id="mj-jour"></div>
    <div class="mj-field" id="mj-employe-bloc" style="display:none"><label>Employé</label>
      <select class="form-control" id="mj-employe"></select></div>
    <div class="mj-field"><label>&nbsp;</label>
      <button class="btn btn-sm btn-default" id="mj-hier">◀ Hier</button></div>
    <div class="mj-field"><label>&nbsp;</label>
      <button class="btn btn-sm btn-default" id="mj-aujourdhui">Aujourd hui</button></div>
    <div class="mj-field"><label>&nbsp;</label>
      <button class="btn btn-sm btn-default" id="mj-demain">Demain ▶</button></div>
    <div class="mj-field"><label>&nbsp;</label>
      <button class="btn btn-sm btn-primary" id="mj-refresh">🔄 Actualiser</button></div>
    <span class="mj-compte" id="mj-compte"></span>
  </div>

  <div id="mj-liste"></div>
</div>
