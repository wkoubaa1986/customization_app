<div class="pp-page">
  <style>
    .pp-page { padding: 10px 12px 40px; max-width: 1100px; }
    .pp-card { background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px;
               padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .pp-periode { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pp-seg { display: flex; background: #f1f5f9; border-radius: 10px; padding: 3px; }
    .pp-seg span { padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; }
    .pp-seg span.on { background: #fff; color: #111827; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .pp-periode select { height: 36px; font-size: 14px; flex: 1 1 160px; max-width: 260px; }
    .pp-titre { font-size: 12px; color: #64748b; margin-left: auto; }
    .pp-aide { font-size: 12px; color: #64748b; margin-top: 6px; }
    .pp-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pp-kpi { border: 1px solid #e2e8f0; border-left: 5px solid #94a3b8; border-radius: 10px; padding: 9px 10px; background: #fff; }
    .pp-kpi[data-bloc] { cursor: pointer; } .pp-kpi[data-bloc]:hover { box-shadow: 0 2px 6px rgba(0,0,0,.08); }
    .pp-kpi .l { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .3px; }
    .pp-kpi .v { font-size: 18px; font-weight: 800; margin-top: 2px; white-space: nowrap; }
    .pp-kpi .s { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
    .pp-kpi .s.omis { color: #c2410c; font-weight: 600; }
    .pp-kpi.ventes { border-left-color: #343deb; } .pp-kpi.stock { border-left-color: #eba234; }
    .pp-kpi.depenses { border-left-color: #eb4034; }
    .pp-kpi.benefice { border-left-color: #22c55e; } .pp-kpi.benefice .v { color: #15803d; }
    .pp-kpi.benefice.perte { border-left-color: #b91c1c; } .pp-kpi.benefice.perte .v { color: #b91c1c; }
    .pp-omis-tete { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
    .pp-omis-tete .n { color: #c2410c; }
    .pp-ligne { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .pp-ligne .lib { min-width: 0; word-break: break-word; }
    .pp-ligne .sub { font-size: 11.5px; color: #64748b; }
    .pp-ligne .mt { text-align: right; font-weight: 700; white-space: nowrap; }
    .pp-ligne.omise .mt { color: #94a3b8; text-decoration: line-through; }
    .pp-ligne.partielle .mt { color: #c2410c; }
    .pp-ligne .act { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pp-badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #fff7ed; color: #c2410c; }
    details.pp-compte { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 8px; background: #fff; }
    details.pp-compte summary { padding: 9px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 13.5px; list-style: none; }
    details.pp-compte summary::-webkit-details-marker { display: none; }
    details.pp-compte summary .nom { flex: 1; min-width: 0; font-weight: 600; }
    details.pp-compte summary .tot { font-weight: 800; white-space: nowrap; }
    details.pp-compte .corps { padding: 0 12px 6px; }
    .pp-entete-detail { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
    .pp-entete-detail b { font-size: 15px; }
    .pp-vide { text-align: center; color: #94a3b8; padding: 16px; }
    @media (max-width: 760px) { .pp-kpis { grid-template-columns: 1fr 1fr; } .pp-titre { margin-left: 0; width: 100%; } }
  </style>
  <div class="pp-card">
    <div class="pp-periode">
      <div class="pp-seg" id="pp-mode"><span data-mode="mois">Mois</span><span data-mode="annee">Année</span><span data-mode="total">Total</span></div>
      <select class="form-control" id="pp-choix"></select>
      <span class="pp-titre" id="pp-titre"></span>
    </div>
    <div class="pp-aide">Le graphique « Pertes et Profits » de l’onglet Comptabilité suit ces choix. Touchez un total pour voir
      ses pièces et omettre ce qui ne doit pas compter. Indépendant de la situation mensuelle.</div>
  </div>
  <div class="pp-kpis" id="pp-kpis"></div>
  <div class="pp-card" id="pp-omissions" style="margin-top:10px"></div>
</div>
