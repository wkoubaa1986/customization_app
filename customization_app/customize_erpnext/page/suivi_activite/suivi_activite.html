<div class="sa-page">
  <style>
    .sa-page { padding: 12px 16px; }
    .sa-card { background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px;
               padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .sa-kpis { display: flex; flex-wrap: wrap; gap: 10px; }
    .sa-kpi { flex: 1 1 110px; border: 1px solid var(--border-color,#e4e8ee); border-radius: 10px; padding: 8px 12px;
              background: var(--bg-light-gray,#f8fafc); cursor: pointer; }
    .sa-kpi.actif { border-color: #3b82f6; background: rgba(59,130,246,.08); }
    .sa-kpi .v { font-size: 19px; font-weight: 700; line-height: 1.1; }
    .sa-kpi .l { font-size: 11px; color: var(--text-muted,#6b7280); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
    .sa-kpi.retard .v { color: #b91c1c; }

    .sa-ecrire { position: relative; }
    .sa-ecrire input.sa-titre { width: 100%; height: 42px; font-size: 15px; padding: 8px 44px 8px 12px; border-radius: 10px; }
    .sa-ecrire .sa-envoi { position: absolute; right: 8px; top: 7px; height: 28px; width: 30px; border: none; border-radius: 8px;
                           background: #111827; color: #fff; font-size: 14px; cursor: pointer; }
    .sa-ecrire-opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; }
    .sa-ecrire-opts .lbl { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .3px; }
    .sa-ecrire-opts input[type=date], .sa-ecrire-opts select { height: 30px; font-size: 12.5px; width: auto; }
    .sa-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .sa-chip { border: 1px solid #cbd5e1; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; cursor: pointer;
               background: #fff; user-select: none; }
    .sa-chip.on { background: #111827; border-color: #111827; color: #fff; }
    .sa-aide { font-size: 11.5px; color: #94a3b8; margin-top: 6px; }

    .sa-barre { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 8px; }
    .sa-barre .form-control { height: 30px; font-size: 12.5px; width: 190px; }
    .sa-barre label { margin: 0; font-size: 12px; cursor: pointer; }
    .sa-barre .droite { margin-left: auto; display: flex; gap: 6px; }

    .sa-groupe { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #64748b; margin: 14px 4px 6px; }
    .sa-ligne { display: grid; grid-template-columns: 30px minmax(220px,1fr) 200px 120px 110px 110px; gap: 10px; align-items: center;
                background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-left: 4px solid #3b82f6;
                border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; }
    .sa-ligne:hover { box-shadow: 0 2px 6px rgba(0,0,0,.07); }
    .sa-ligne.p-Basse { border-left-color: #94a3b8; } .sa-ligne.p-Haute { border-left-color: #f59e0b; } .sa-ligne.p-Urgente { border-left-color: #dc2626; }
    .sa-ligne.ferme { opacity: .6; }
    .sa-ligne.ferme .t { text-decoration: line-through; }
    .sa-coche { width: 24px; height: 24px; border-radius: 999px; border: 2px solid #94a3b8; display: flex; align-items: center;
                justify-content: center; font-size: 13px; color: #fff; cursor: pointer; }
    .sa-coche.ok { background: #22c55e; border-color: #22c55e; }
    .sa-coche:hover { border-color: #22c55e; }
    .sa-ligne .t { font-weight: 600; font-size: 13.5px; line-height: 1.3; word-break: break-word; }
    .sa-ligne .m { font-size: 11.5px; color: #64748b; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
    .sa-pastille { display: inline-block; background: #f1f5f9; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; margin: 1px 2px 1px 0; }
    .sa-date { font-size: 12px; color: #475569; } .sa-date.retard { color: #b91c1c; font-weight: 700; }
    .sa-badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .s-afaire { background: #f1f5f9; color: #475569; } .s-encours { background: #dbeafe; color: #1e40af; }
    .s-attente { background: #fef3c7; color: #92400e; } .s-terminee { background: #dcfce7; color: #166534; } .s-annulee { background: #fee2e2; color: #991b1b; }
    .sa-prog { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; } .sa-prog > div { height: 100%; background: #22c55e; }
    .sa-pct { font-size: 11px; color: #64748b; margin-top: 2px; }
    .sa-vide { color: #94a3b8; font-size: 13px; text-align: center; padding: 24px; }
    @media (max-width: 760px) {
      .sa-ligne { grid-template-columns: 30px 1fr; }
      .sa-ligne > .col { grid-column: 2; }
    }

    .sa-section { margin-top: 14px; }
    .sa-section h6 { font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: #64748b; margin: 0 0 6px; font-weight: 700;
                     display: flex; align-items: center; gap: 8px; }
    .sa-etape { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .sa-etape.fait span.lib { text-decoration: line-through; color: #94a3b8; }
    .sa-etape .sup, .sa-fic .sup { margin-left: auto; color: #94a3b8; cursor: pointer; }
    .sa-ajout { display: flex; gap: 6px; margin-top: 6px; }
    .sa-ajout input, .sa-ajout textarea { flex: 1; font-size: 12.5px; }
    .sa-galerie { display: flex; flex-wrap: wrap; gap: 8px; }
    .sa-galerie .ph { position: relative; }
    .sa-galerie .ph img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; border: 1px solid #e4e8ee; }
    .sa-galerie .ph .sup { position: absolute; top: 2px; right: 4px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 0 5px; cursor: pointer; }
    .sa-fic { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
    .sa-note { border-left: 3px solid #cbd5e1; padding: 4px 10px; margin-bottom: 8px; }
    .sa-note .qui { font-size: 11px; color: #64748b; }
    .sa-note .txt { white-space: pre-wrap; font-size: 13px; }
    .sa-statuts { display: flex; flex-wrap: wrap; gap: 6px; }
    .sa-ia { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 10px; padding: 10px 12px; }
    .sa-ia .desc { white-space: pre-wrap; font-size: 13px; }
  </style>

  <div class="sa-card"><div class="sa-kpis" id="sa-kpis"></div></div>

  <div class="sa-card">
    <div class="sa-ecrire">
      <input type="text" class="form-control sa-titre" id="sa-titre" placeholder="Écrire une activité…" autocomplete="off">
      <button class="sa-envoi" id="sa-envoi" title="Ajouter">↵</button>
    </div>
    <div class="sa-ecrire-opts">
      <div id="sa-pour" style="display:none"><span class="lbl">Pour</span> <div class="sa-chips" id="sa-chips" style="display:inline-flex"></div></div>
      <div><span class="lbl">Prévue le</span> <input type="date" class="form-control" id="sa-date" style="display:inline-block"></div>
      <div><span class="lbl">Priorité</span> <select class="form-control" id="sa-prio" style="display:inline-block"></select></div>
    </div>
    <div class="sa-aide" id="sa-aide"></div>
  </div>

  <div class="sa-barre">
    <select class="form-control" id="sa-employe" style="display:none"><option value="">Tous les employés</option></select>
    <input type="text" class="form-control" id="sa-recherche" placeholder="Rechercher…">
    <label><input type="checkbox" id="sa-fermees"> Anciennes terminées / annulées</label>
    <div class="droite">
      <button class="btn btn-default btn-xs" id="sa-config" style="display:none">⚙️ Réglage</button>
    </div>
  </div>

  <div id="sa-liste"></div>
</div>
