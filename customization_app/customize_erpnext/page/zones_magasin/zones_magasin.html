<div class="zm-page">
  <style>
    .zm-page { padding: 10px 12px 110px; max-width: 1200px; }
    .zm-card { background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px;
               padding: 10px 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .zm-vues { display: flex; background: #f1f5f9; border-radius: 12px; padding: 4px; margin-bottom: 10px; }
    .zm-vue { flex: 1; text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; cursor: pointer; color: #475569; }
    .zm-vue.on { background: #fff; color: #111827; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .zm-saisie { width: 100%; height: 40px; font-size: 14px; }
    .zm-aide { font-size: 11.5px; color: #94a3b8; margin-top: 4px; }

    .zm-espace { margin-bottom: 12px; }
    .zm-espace-tete { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .zm-espace-tete .nom { font-size: 16px; font-weight: 700; cursor: pointer; }
    .zm-espace-tete .n { font-size: 12px; color: #64748b; cursor: pointer; }
    .zm-espace-tete .act { margin-left: auto; display: flex; gap: 4px; }
    .zm-act { font-size: 15px; padding: 4px 7px; cursor: pointer; color: #64748b; border-radius: 8px; }
    .zm-act:hover { background: #f1f5f9; }
    .zm-tuiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .zm-tuile { border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 8px; text-align: center; cursor: pointer; background: #fff; }
    .zm-tuile:hover { border-color: #93c5fd; }
    .zm-tuile .c { font-weight: 700; font-size: 15px; word-break: break-word; }
    .zm-tuile .n { font-size: 11.5px; color: #94a3b8; }
    .zm-tuile.vide .c { color: #94a3b8; }

    .zm-filtres { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .zm-filtres .plein { grid-column: 1 / -1; }
    .zm-filtres .form-control { height: 38px; font-size: 14px; width: 100%; }
    .zm-filtres label { font-size: 13px; margin: 0; display: flex; align-items: center; gap: 6px; }
    .zm-info { font-size: 12px; color: #64748b; margin: 4px 2px 8px; }
    .zm-aramex { font-size: 12.5px; color: #92400e; background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
                 padding: 7px 10px; margin-bottom: 10px; }
    .zm-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
                  background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px;
                  padding: 8px 10px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .zm-actions .sel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-right: auto; font-size: 13px; }
    .zm-actions .lien { color: #2563eb; cursor: pointer; font-size: 12.5px; }
    .zm-actions .boutons { display: flex; gap: 6px; flex-wrap: wrap; }
    .zm-actions .btn, .zm-actions select { height: 32px; font-size: 13px; }
    .zm-actions select { border-radius: 6px; border: 1px solid var(--border-color,#d1d5db); padding: 0 6px; max-width: 220px; }
    .zm-actions.vide .boutons { opacity: .45; pointer-events: none; }
    @media (min-width: 768px) { .zm-actions { position: sticky; top: var(--zm-haut, 0px); z-index: 5; } }
    .zm-table-wrap { overflow-x: auto; background: var(--card-bg,#fff); border: 1px solid var(--border-color,#e4e8ee); border-radius: 12px; }
    .zm-table { width: 100%; min-width: 920px; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .zm-table th { background: #f8fafc; color: #475569; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;
                   text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    .zm-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; background: var(--card-bg,#fff); }
    .zm-table tr.sel td { background: #eff6ff; }
    .zm-table .c-sel { width: 34px; text-align: center; position: sticky; left: 0; z-index: 1; }
    .zm-table th.c-sel { z-index: 2; }
    .zm-table .c-sel input { width: 17px; height: 17px; cursor: pointer; margin: 0; }
    .zm-table .c-art { min-width: 230px; position: sticky; left: 34px; z-index: 1; box-shadow: 1px 0 0 #f1f5f9; }
    .zm-table th.c-art { z-index: 2; }
    .zm-table .c-grp { color: #475569; min-width: 150px; }
    .zm-table .c-stock { color: #475569; white-space: nowrap; font-size: 12.5px; }
    .zm-table .c-zones { min-width: 220px; }
    .zm-table .c-sortie { min-width: 170px; }
    .zm-table .c-sortie select { height: 32px; font-size: 13px; width: 100%; }
    .zm-art-cell { display: flex; gap: 8px; align-items: center; }
    .zm-art-cell .zm-img { width: 34px; height: 34px; font-size: 16px; border-radius: 8px; }
    .zm-art-cell a { color: inherit; }
    .zm-zchips { display: flex; flex-wrap: wrap; gap: 4px; }
    .zm-zchip { background: #eff6ff; color: #1e40af; border-radius: 999px; padding: 2px 3px 2px 9px; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
    .zm-zchip .x { padding: 0 5px; cursor: pointer; color: #60a5fa; font-size: 13px; }
    .zm-zchip.plus { background: #fff; border: 1px dashed #93c5fd; color: #2563eb; padding: 2px 9px; cursor: pointer; }
    .zm-zchip.aucune { background: #fff7ed; color: #c2410c; padding: 2px 9px; }
    .zm-plus { display: block; width: 100%; margin: 12px 0; height: 40px; }
    .zm-vide { text-align: center; color: #94a3b8; padding: 24px 10px; }

    .zm-ligne { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
    .zm-ligne .zm-img { width: 40px; height: 40px; font-size: 18px; }
    .zm-ligne .txt { flex: 1; min-width: 0; }
    .zm-ligne .bt { flex: none; font-size: 18px; width: 36px; height: 36px; border-radius: 10px; border: 1px solid #e2e8f0; background: #fff;
                    display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .zm-ligne .bt.ajout { color: #16a34a; } .zm-ligne .bt.retrait { color: #dc2626; } .zm-ligne .bt.fait { background: #dcfce7; border-color: #86efac; }
    .zm-choix-espace { font-weight: 700; font-size: 13px; margin: 10px 0 6px; color: #334155; }
    .zm-choix { display: flex; flex-wrap: wrap; gap: 6px; }
    .zm-choix .ch { border: 1px solid #cbd5e1; border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; background: #fff; user-select: none; }
    .zm-choix .ch.on { background: #2563eb; border-color: #2563eb; color: #fff; }
    .zm-choix-espace .tout { font-weight: 600; font-size: 12px; color: #2563eb; cursor: pointer; margin-left: 8px; }
    .zm-nom { font-weight: 600; font-size: 13.5px; line-height: 1.25; word-break: break-word; }
    .zm-code { font-size: 11.5px; color: #64748b; margin-top: 1px; word-break: break-all; }
    .zm-img { width: 52px; height: 52px; border-radius: 10px; object-fit: contain; border: 1px solid #e4e8ee; background: #f8fafc;
              flex: none; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 22px; }
    .zm-lbl { font-size: 10.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .3px; margin: 8px 0 3px; display: block; }
    @media (max-width: 600px) { .zm-filtres { grid-template-columns: 1fr; } .zm-actions select { max-width: none; flex: 1 1 100%; } }
  </style>

  <div class="zm-vues">
    <div class="zm-vue on" data-vue="zones">📍 Par zone</div>
    <div class="zm-vue" data-vue="articles">📦 Par article</div>
  </div>

  <div id="zm-v-zones">
    <div class="zm-card" id="zm-nouvel-espace" style="display:none">
      <input type="text" class="form-control zm-saisie" id="zm-espace-saisie" placeholder="➕ Nouvel espace (ex. Dépôt) puis Entrée">
    </div>
    <div id="zm-espaces"></div>
  </div>

  <div id="zm-v-articles" style="display:none">
    <div class="zm-card">
      <div class="zm-filtres">
        <input type="search" class="form-control plein" id="zm-recherche" placeholder="🔎 Article (nom ou code)…">
        <select class="form-control" id="zm-filtre-zone"></select>
        <select class="form-control" id="zm-sortie"></select>
        <select class="form-control" id="zm-groupe"></select>
        <label><input type="checkbox" id="zm-stockes" checked> Stockés seulement</label>
      </div>
    </div>
    <div class="zm-aramex" id="zm-aramex" style="display:none"></div>
    <div class="zm-info" id="zm-info"></div>
    <div class="zm-actions vide" id="zm-actions" style="display:none">
      <div class="sel">
        <b id="zm-compte">0 article coché</b>
        <span class="lien" id="zm-tout-filtre"></span>
        <span class="lien" id="zm-aucun" style="display:none">Décocher</span>
      </div>
      <div class="boutons">
        <button class="btn btn-default" id="zm-lot-ajout">📍 Ranger dans…</button>
        <button class="btn btn-default" id="zm-lot-retrait">➖ Retirer de…</button>
        <select id="zm-lot-sortie"></select>
      </div>
    </div>
    <div class="zm-table-wrap">
      <table class="zm-table">
        <thead><tr>
          <th class="c-sel"><input type="checkbox" id="zm-page-tout" title="Cocher les articles affichés"></th>
          <th class="c-art">Article</th><th class="c-grp">Groupe</th><th class="c-stock">Stock</th>
          <th class="c-zones">📍 Zones</th><th class="c-sortie">🚚 Sortie principale</th>
        </tr></thead>
        <tbody id="zm-lignes"></tbody>
      </table>
    </div>
    <button class="btn btn-default zm-plus" id="zm-plus" style="display:none">Afficher plus</button>
  </div>
</div>
