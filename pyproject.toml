[project]
name = "customization_app"
authors = [
    { name = "Wassim", email = "koubaawassim@gmail.com"}
]
description = "This app aloow to change same functionalities in erpnext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Scan des justificatifs de caisse : détection du quadrilatère de la feuille et
    # redressement de perspective (caisse_depenses._scan_pdf). Entre dans l'image de
    # prod au build (pip install de l'app lit ce fichier).
    "opencv-python-headless~=4.10",
    # Lecture du conteneur OLE d'un .xls pour en extraire les images (xls_images.py) :
    # xlrd ne lit que les valeurs, les photos du fournisseur disparaissaient à la conversion.
    "olefile~=0.47",
    # Lecture des classeurs .xls (BIFF, d'avant 2007) que les fournisseurs
    # chinois envoient encore : openpyxl ne sait pas les ouvrir
    # (lci_reponse._feuilles).
    "xlrd~=2.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
