[project]
name = "customization_app"
authors = [
    { name = "Wassim", email = "koubaawassim@gmail.com"}
]
description = "This app aloow to change same functionalities in erpnext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Scan des justificatifs de caisse : détection du quadrilatère de la feuille et
    # redressement de perspective (caisse_depenses._scan_pdf). Entre dans l'image de
    # prod au build (pip install de l'app lit ce fichier).
    "opencv-python-headless~=4.10",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
